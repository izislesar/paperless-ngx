# laptop selfhost, manual runs only. heavy stack — needs ~2gb free ram.
# if the laptop struggles, run paperless on demand and stop after.
# usage: docker compose -f selfhost/docker-compose.yml --env-file selfhost/.env up -d

services:
  broker:
    image: docker.io/library/redis:7-alpine
    container_name: paperless-broker
    restart: "no"
    volumes:
      - paperless-redis:/data

  db:
    image: docker.io/library/postgres:16-alpine
    container_name: paperless-db
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      - POSTGRES_DB=paperless
      - POSTGRES_USER=paperless
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
    volumes:
      - paperless-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless"]
      interval: 10s
      timeout: 5s
      retries: 5

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
    ports:
      - "${PAPERLESS_PORT:-8084}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - PAPERLESS_REDIS=redis://broker:6379/0
      - PAPERLESS_DBENGINE=postgresql
      - PAPERLESS_DBHOST=db
      - PAPERLESS_DBNAME=paperless
      - PAPERLESS_DBUSER=paperless
      - PAPERLESS_DBPASS=${DB_PASSWORD:-changeme}
      - PAPERLESS_SECRET_KEY=${SECRET_KEY:-changeme-replace-with-random-50}
      - PAPERLESS_URL=https://docs.example.com
      - PAPERLESS_OCR_LANGUAGE=${OCR_LANG:-eng}
      - USERMAP_UID=1000
      - USERMAP_GID=1000
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - ./consume:/usr/src/paperless/consume
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  paperless-db:
    name: paperless-db
  paperless-redis:
    name: paperless-redis
  paperless-data:
    name: paperless-data
  paperless-media:
    name: paperless-media
